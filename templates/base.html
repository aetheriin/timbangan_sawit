<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Timbangan{% endblock %} - Smart Weighbridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen">

    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-500 text-slate-900 p-2 rounded-lg font-bold">
                <i class="fa-solid fa-truck-ramp-box text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold leading-none text-white">Smart Weighbridge</h1>
                <span class="text-xs text-emerald-400 font-medium">PT Yuni Bersaudara Sejahtera</span>
            </div>
        </div>
        <div class="flex items-center space-x-6 text-sm">
            <a href="/dashboard" class="text-slate-300 hover:text-white transition {{ 'text-emerald-400 font-semibold' if active_page == 'dashboard' }}">
                <i class="fa-solid fa-chart-pie mr-1"></i> Dashboard
            </a>
            <a href="/timbang" class="text-slate-300 hover:text-white transition {{ 'text-emerald-400 font-semibold' if active_page == 'timbang' }}">
                <i class="fa-solid fa-weight-scale mr-1"></i> Timbang
            </a>
            <a href="/supir" class="text-slate-300 hover:text-white transition {{ 'text-emerald-400 font-semibold' if active_page == 'supir' }}">
                <i class="fa-solid fa-id-card mr-1"></i> Data Supir
            </a>
            <a href="/riwayat" class="text-slate-300 hover:text-white transition {{ 'text-emerald-400 font-semibold' if active_page == 'riwayat' }}">
                <i class="fa-solid fa-list-check mr-1"></i> Riwayat
            </a>
            {% if current_user.is_authenticated %}
            <div class="flex items-center space-x-3 border-l border-slate-700 pl-6">
                <span class="text-slate-300 text-xs">{{ current_user.nama_lengkap }}</span>
                <a href="/logout" class="text-slate-400 hover:text-red-400"><i class="fa-solid fa-right-from-bracket"></i></a>
            </div>
            {% else %}
            <a href="/login" class="text-slate-400 hover:text-white text-xs border-l border-slate-700 pl-6">
                <i class="fa-solid fa-right-to-bracket mr-1"></i> Login
            </a>
            {% endif %}
        </div>
    </nav>

    <div class="p-6 max-w-[1400px] mx-auto">
        {% block content %}{% endblock %}
    </div>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
